name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        go: [ '1.27' ]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify Formatting (Linux only)
        if: runner.os == 'Linux'
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "Unformatted files found:"
            echo "$DIFF"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...
        if: runner.os == 'Linux'

      - name: Run Tests (Windows)
        run: go test -v ./...
        if: runner.os == 'Windows'

  native-boot:
    name: Native AOT + freestanding boot smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build compiler and boot kernel
        run: bash scripts/test_boot.sh

      - name: Native compiler unit tests
        run: |
          g++ -std=c++17 -O1 -Icompiler/src -Icompiler/third_party \
            $(find compiler/src -name '*.cpp' ! -path '*/runtime/*' ! -name 'main_runner.cpp' ! -path '*/cli/*') \
            $(find compiler/tests -name '*.cpp' ! -name 'test_runtime.cpp') \
            -o /tmp/pawl_tests
          /tmp/pawl_tests
